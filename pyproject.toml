[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "1.0.0"
description = "Autonomous CI/CD Failure Triage, Root-Cause Analysis & Sandboxed Repair Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "docker>=7.1.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
